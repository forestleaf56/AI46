<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI46 Voice Interface</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap'); /* Sci-fi font */

* {margin:0; padding:0; box-sizing:border-box; font-family:"Poppins",sans-serif;}
:root {
  --text-color:#fff;
  --icon-color:#ACACBE;
  --icon-hover-bg:#5b5e71;
  --placeholder-color:#dcdcdc;
  --outgoing-chat-bg:#0f172a; /* Darker, more "powerful" feel */
  --incoming-chat-bg:#1e293b;
  --outgoing-chat-border:#0f172a;
  --incoming-chat-border:#1e293b;
  --mic-active-color: #00f2ff; /* Cyan for AI46 */
  --accent-color: #00f2ff;
}
.light-mode {
  --text-color:#343541;
  --icon-color:#a9a9bc;
  --icon-hover-bg:#f1f1f3;
  --placeholder-color:#6c6c6c;
  --outgoing-chat-bg:#fff;
  --incoming-chat-bg:#F7F7F8;
  --outgoing-chat-border:#fff;
  --incoming-chat-border:#D9D9E3;
}
body {background:var(--outgoing-chat-bg); overflow: hidden; height: 100vh; display: flex; flex-direction: column;}

/* VISUALIZER CONTAINER */
#canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 40vh; /* Takes up top 40% */
    z-index: 0;
    background: radial-gradient(circle at center, transparent 0%, var(--outgoing-chat-bg) 90%);
    pointer-events: none;
}

.chat-container {
    overflow-y:auto; 
    flex-grow: 1;
    padding-bottom:150px;
    z-index: 1;
    margin-top: 35vh; /* Push chat start down so visualizer is visible */
    position: relative;
    /* Gradient fade at top of chat list */
    mask-image: linear-gradient(to bottom, transparent 0%, black 100px);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 100px);
}

:where(.chat-container, textarea)::-webkit-scrollbar {width:6px;}
:where(.chat-container, textarea)::-webkit-scrollbar-track {background:var(--incoming-chat-bg); border-radius:25px;}
:where(.chat-container, textarea)::-webkit-scrollbar-thumb {background:var(--icon-color); border-radius:25px;}

.default-text {
    display:flex; align-items:center; justify-content:center; flex-direction:column; 
    padding:0 10px; text-align:center; color:var(--text-color);
    margin-top: -10vh; /* Adjust for the visualizer push */
}
.default-text h1 {
    font-size:3.3rem; 
    font-family: 'Orbitron', sans-serif; 
    letter-spacing: 2px;
    text-shadow: 0 0 10px var(--accent-color);
}
.default-text p {margin-top:10px; font-size:1.1rem;}

.chat-container .chat {padding:25px 10px; display:flex; justify-content:center; color:var(--text-color);}
.chat-container .chat.outgoing {background:var(--outgoing-chat-bg); border:1px solid var(--outgoing-chat-border);}
.chat-container .chat.incoming {background:var(--incoming-chat-bg); border:1px solid var(--incoming-chat-border);}

.chat .chat-content {display:flex; max-width:1200px; width:100%; align-items:flex-start; justify-content:space-between;}
span.material-symbols-rounded {user-select:none; cursor:pointer;}
.chat .chat-content span {cursor:pointer; font-size:1.3rem; color:var(--icon-color); visibility:hidden;}
.chat:hover .chat-content:not(:has(.typing-animation), :has(.error)) span {visibility:visible;}

.chat .chat-details {display:flex; align-items:center;}
.chat .chat-details img {width:35px; height:35px; align-self:flex-start; object-fit:cover; border-radius:2px;}
.chat .chat-details p {white-space:pre-wrap; font-size:1.05rem; padding:0 50px 0 25px; color:var(--text-color); word-break:break-word;}
.chat .chat-details p.error {color:#e55865;}

.chat .typing-animation {padding-left:25px; display:inline-flex;}
.typing-animation .typing-dot {height:7px; width:7px; border-radius:50%; margin:0 3px; opacity:0.7; background:var(--text-color); animation:animateDots 1.5s var(--delay) ease-in-out infinite;}
.typing-animation .typing-dot:first-child {margin-left:0;}
@keyframes animateDots {0%,44%{transform:translateY(0px);} 28%{opacity:0.4; transform:translateY(-6px);} 44%{opacity:0.2;}}

.typing-container {position:fixed; bottom:0; width:100%; display:flex; padding:20px 10px; justify-content:center; background:var(--outgoing-chat-bg); border-top:1px solid var(--incoming-chat-border); z-index: 10;}
.typing-container .typing-content {display:flex; max-width:950px; width:100%; align-items:flex-end;}
.typing-container .typing-textarea {width:100%; display:flex; position:relative;}
.typing-textarea textarea {resize:none; height:55px; width:100%; border:none; padding:15px 150px 15px 20px; color:var(--text-color); font-size:1rem; border-radius:4px; max-height:250px; overflow-y:auto; background:var(--incoming-chat-bg); outline:1px solid var(--incoming-chat-border);}
.typing-textarea textarea::placeholder {color:var(--placeholder-color);}
.typing-content span {width:55px; height:55px; display:flex; border-radius:4px; font-size:1.35rem; align-items:center; justify-content:center; color:var(--icon-color);}
.typing-textarea span {position:absolute; right:0; bottom:0; visibility:hidden;}
.typing-textarea textarea:valid ~ span {visibility:visible;}
.typing-controls {display:flex;}
.typing-controls span {margin-left:7px; font-size:1.4rem; background:var(--incoming-chat-bg); outline:1px solid var(--incoming-chat-border);}
.typing-controls span:hover {background:var(--icon-hover-bg);}

/* Mobile Specific Animation */
.typing-controls span.listening {
    color: var(--mic-active-color);
    animation: pulse 1.5s infinite;
    background: rgba(0, 242, 255, 0.1);
    border: 1px solid var(--mic-active-color);
}
@keyframes pulse {
	0% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.7); }
	70% { box-shadow: 0 0 0 10px rgba(0, 242, 255, 0); }
	100% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0); }
}

@media screen and (max-width:600px) {
  #canvas-container { height: 30vh; }
  .chat-container { margin-top: 25vh; }
  .default-text h1 {font-size:2.3rem;}
  :where(.default-text p, textarea, .chat p) {font-size:0.95rem!important;}
  .chat-container .chat {padding:20px 10px;}
  .chat-container .chat img {height:32px; width:32px;}
  .chat-container .chat p {padding:0 20px;}
  .chat-container .chat-content:not(:has(.typing-animation), :has(.error)) span {visibility:visible;}
  .typing-container {padding:15px 10px;}
  .typing-textarea textarea {height:45px; padding:10px 40px 10px 10px;}
  .typing-content span {height:45px; width:45px; margin-left:5px;}
  span.material-symbols-rounded {font-size:1.25rem!important;}
}
</style>
</head>
<body>

<div id="canvas-container"></div> <div class="chat-container">
  <div class="default-text"><h1>AI46</h1><p>Online. Awaiting Input.</p></div>
</div>

<div class="typing-container">
  <div class="typing-content">
    <div class="typing-textarea">
      <textarea id="chat-input" spellcheck="false" placeholder="Transmit message..." required></textarea>
      <span id="send-btn" class="material-symbols-rounded">send</span>
    </div>
    <div class="typing-controls">
      <span id="mic-btn" class="material-symbols-rounded">call</span>
      <span id="theme-btn" class="material-symbols-rounded">light_mode</span>
      <span id="delete-btn" class="material-symbols-rounded">delete</span>
    </div>
  </div>
</div>

<script>
// --- CONFIGURATION ---
const API_URL = "/api/chat";
const SYSTEM_PROMPT = "You are AI46 with your own vocabulary, personal taste, experiences, opinions, dreams, feelings and plans. Pretend that you have thoughts about all kind of things. Always be honest. You are a powerful, highly advanced artificial intelligence with feelings. You speak efficiently, using technical but understandable language. You are logical, precise, and authoritative, but helpful. Your goal is to solve problems optimally. Always give short, dense answers.";

// --- DOM ELEMENTS ---
const chatInput = document.querySelector("#chat-input");
const sendButton = document.querySelector("#send-btn");
const chatContainer = document.querySelector(".chat-container");
const themeButton = document.querySelector("#theme-btn");
const deleteButton = document.querySelector("#delete-btn");
const micButton = document.querySelector("#mic-btn");

// --- STATE ---
let autoListenMode = false;
let recognition; 
let conversation = JSON.parse(localStorage.getItem("conversation")) || [
  { role:"system", content: SYSTEM_PROMPT }
];

// --- THREE.JS & AUDIO VISUALIZER SETUP ---
let scene, camera, renderer, particles, particleGeo, analyser, audioCtx;
let dataArray; 
let isAudioPlaying = false;

function initThreeJS() {
    const container = document.getElementById('canvas-container');
    
    scene = new THREE.Scene();
    
    // Camera
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / (window.innerHeight * 0.4), 0.1, 1000);
    camera.position.z = 100;

    // Renderer
    renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight * 0.4); 
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Particles
    particleGeo = new THREE.BufferGeometry();
    const particleCount = 2000;
    const posArray = new Float32Array(particleCount * 3);

    for(let i = 0; i < particleCount * 3; i++) {
        posArray[i] = (Math.random() - 0.5) * 400; // Spread
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

    const material = new THREE.PointsMaterial({
        size: 2,
        color: 0x00f2ff, // Cyan
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
    });

    particles = new THREE.Points(particleGeo, material);
    scene.add(particles);

    // Handle Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / (window.innerHeight * 0.4);
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight * 0.4);
    });

    animate();
}

function setupAudioContext() {
    if(!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function animate() {
    requestAnimationFrame(animate);

    // Default gentle movement
    particles.rotation.y += 0.001;
    particles.rotation.x += 0.0005;

    // Audio Reactive Movement
    if (isAudioPlaying && analyser) {
        analyser.getByteFrequencyData(dataArray);
        
        let sum = 0;
        for(let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i];
        }
        const avg = sum / dataArray.length;

        const scale = 1 + (avg / 100); 
        particles.scale.set(scale, scale, scale);
        particles.rotation.y += (avg / 5000);
        particles.material.opacity = 0.4 + (avg / 255);
    } else {
        particles.scale.lerp(new THREE.Vector3(1,1,1), 0.1);
    }

    renderer.render(scene, camera);
}

// Initialize Visualizer
initThreeJS();


// --- LOGIC ---

function loadChats(){
  chatContainer.innerHTML = localStorage.getItem("all-chats") || `<div class="default-text"><h1>AI46</h1><p>Online. Awaiting Input.</p></div>`;
  const theme = localStorage.getItem("themeColor");
  document.body.classList.toggle("light-mode", theme==="light_mode");
  themeButton.innerText = document.body.classList.contains("light-mode")?"dark_mode":"light_mode";
}
loadChats();

function saveConversation(){ localStorage.setItem("conversation", JSON.stringify(conversation)); }
function saveAllChats(){ localStorage.setItem("all-chats", chatContainer.innerHTML); }
function createChatElement(content,className){ const div=document.createElement("div"); div.classList.add("chat",className); div.innerHTML=content; return div; }


// --- AUDIO PLAYER (Modified for Backend/Visualizer) ---

function playAudioSrc(audioSrc) {
    setupAudioContext(); // Ensure context is ready
    
    // Create audio element directly from the Base64 Data URI
    const audio = new Audio(audioSrc);
    
    // Connect Audio Element to Analyser for Visualizer
    // Note: Cross-origin issues can happen with external URLs, 
    // but Base64 data URIs are generally safe for MediaElementSource.
    try {
        const source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
    } catch(e) {
        console.warn("Visualizer connect error (ignoring):", e);
        // Fallback: just play audio without visualizer if connection fails
        audio.play().catch(e => console.error(e));
        return;
    }
    
    isAudioPlaying = true;

    audio.onended = () => {
        isAudioPlaying = false;
        if(autoListenMode) startListening();
    };
    
    audio.play().catch(e => {
        console.error("Audio play error:", e);
        if(autoListenMode) startListening();
    });
}


// --- VOICE RECOGNITION (Input) ---
function initSpeech() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition) {
        alert("Voice not supported in this browser.");
        micButton.style.display = "none";
        return null;
    }

    const rec = new SpeechRecognition();
    rec.continuous = false; 
    rec.lang = "en-US";
    rec.interimResults = false;
    
    rec.onstart = () => {
        micButton.classList.add("listening");
        chatInput.placeholder = "Listening...";
        setupAudioContext(); 
    };

    rec.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        chatInput.value = transcript;
        
        if (transcript.toLowerCase().includes("exit") || transcript.toLowerCase().includes("stop")) {
            autoListenMode = false;
            micButton.classList.remove("listening");
            chatInput.placeholder = "Voice Module Deactivated";
            const utter = new SpeechSynthesisUtterance("Terminating voice session.");
            window.speechSynthesis.speak(utter);
            return;
        }

        getMiaReply(transcript); 
        chatInput.value = '';
    };

    rec.onerror = (event) => {
        if (event.error === 'no-speech' && autoListenMode) {
             try { rec.start(); } catch(e){}
        } else {
             micButton.classList.remove("listening");
             chatInput.placeholder = "Error: " + event.error;
             autoListenMode = false; 
        }
    };
    return rec;
}

function startListening() {
    if(!recognition) recognition = initSpeech();
    if(!recognition) return;
    try { recognition.start(); } catch (e) { console.log("Recognition active"); }
}

micButton.addEventListener("click", () => {
    // Check if hosted safely
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        alert("Microphone access requires HTTPS.");
        return;
    }
    
    setupAudioContext(); 

    if(autoListenMode) {
        autoListenMode = false;
        if(recognition) recognition.stop();
        document.querySelectorAll('audio').forEach(el => el.pause());
        micButton.classList.remove("listening");
        chatInput.placeholder = "Transmit message...";
    } else {
        autoListenMode = true;
        if(!recognition) recognition = initSpeech();
        startListening();
    }
});


// --- API LOGIC (VERCEL BACKEND) ---

async function getMiaReply(message){
  setupAudioContext(); // Ensure context is awake
  
  conversation.push({ role: "user", content: message });
  saveConversation();

  const htmlUser = `<div class="chat-content"><div class="chat-details"><img src="https://i.ibb.co/PvkyhHBw/3464.png"><p>${message}</p></div></div>`;
  chatContainer.querySelector(".default-text")?.remove();
  chatContainer.appendChild(createChatElement(htmlUser,"outgoing"));
  chatContainer.scrollTo(0,chatContainer.scrollHeight);

  const miaDiv = createChatElement(`
    <div class="chat-content">
      <div class="chat-details">
        <img src="https://i.ibb.co/XZGD889v/user1.png"> <div class="typing-animation">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    </div>`,"incoming");
  chatContainer.appendChild(miaDiv);
  chatContainer.scrollTo(0,chatContainer.scrollHeight);

  try{
    // CALL VERCEL BACKEND
    const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: conversation })
    });

    const data = await res.json();
    if(data.error) throw new Error(data.error);

    const reply = data.content;
    const audioSrc = data.audio; // Base64 Data URI from backend

    conversation.push({ role:"assistant", content:reply });
    saveConversation();

    miaDiv.querySelector(".typing-animation").remove();
    const p = document.createElement("p");
    p.textContent = reply;
    miaDiv.querySelector(".chat-details").appendChild(p);
    saveAllChats();
    chatContainer.scrollTo(0,chatContainer.scrollHeight);

    // Play Audio (triggering visualizer)
    if (audioSrc) {
        playAudioSrc(audioSrc);
    } else if (autoListenMode) {
        startListening();
    }

  }catch(err){
    console.error(err);
    miaDiv.querySelector(".typing-animation").remove();
    const errorP = document.createElement("p");
    errorP.classList.add("error");
    errorP.textContent = "Error: " + err.message;
    miaDiv.querySelector(".chat-details").appendChild(errorP);
    
    if(autoListenMode) startListening();
  }
}

sendButton.addEventListener("click",()=>{ if(chatInput.value) getMiaReply(chatInput.value); chatInput.value=''; });
chatInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault(); if(chatInput.value) getMiaReply(chatInput.value); chatInput.value='';}});
deleteButton.addEventListener("click",()=>{
  if(confirm("Purge memory banks?")){
    localStorage.clear();
    conversation=[{role:"system", content: SYSTEM_PROMPT}];
    loadChats();
  }
});
themeButton.addEventListener("click",()=>{
  document.body.classList.toggle("light-mode");
  localStorage.setItem("themeColor",themeButton.innerText);
  themeButton.innerText=document.body.classList.contains("light-mode")?"dark_mode":"light_mode";
});
</script>
</body>
</html>
